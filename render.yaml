# Render Deployment Blueprint for StockTrace
# Specification Section 29: Target Render Static Site
services:
  - type: web
    name: stocktrace
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_SUPERVISOR_EMAIL
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
